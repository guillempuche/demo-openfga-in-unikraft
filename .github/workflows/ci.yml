name: CI

# Each action is pinned to a full commit SHA, with its release in a comment.
# A tag such as v7 can be moved to point at other code; a commit can't.
# Renovate updates the SHA and the comment together.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  models:
    name: FGA model tests
    runs-on: ubuntu-latest
    env:
      FGA_VERSION: 0.8.1 # keep in sync with versions.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install fga CLI
        run: |
          curl -fsSL "https://github.com/openfga/cli/releases/download/v${FGA_VERSION}/fga_${FGA_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin fga
          fga version
      # One glob: --tests takes a single path or pattern, so listing two files
      # would silently test only the first.
      - run: fga model test --tests 'authz/models/*.fga.yaml'
      # Every relation needs a passing true and false check, every type a
      # list_objects and list_users assertion, and every single-rule break of
      # the model (mutant) must make a test fail.
      - run: python3 scripts/check-model-coverage.py

  api:
    name: API typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  scripts:
    name: Shell scripts and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash -n scripts/*.sh scripts/env.sh
      - run: ./scripts/check-versions.sh
      - run: ./scripts/check-kraftfiles.sh
      - run: shellcheck -x -S warning scripts/*.sh scripts/env.sh
      - run: docker compose -f authz/docker-compose.yaml --env-file authz/.env.example config --quiet

  integration:
    name: OpenFGA integration suite and API coverage
    runs-on: ubuntu-latest
    env:
      FGA_VERSION: 0.8.1 # keep in sync with versions.env
      GRPCURL_VERSION: 1.9.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/integration/package-lock.json
      - name: Install fga CLI and grpcurl
        run: |
          curl -fsSL "https://github.com/openfga/cli/releases/download/v${FGA_VERSION}/fga_${FGA_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin fga
          curl -fsSL "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin grpcurl
      - name: Start OpenFGA (v1.21.0, PostgreSQL 16, experimental tier on)
        run: docker compose -f tests/integration/docker-compose.yaml up -d --wait
      - run: npm ci
        working-directory: tests/integration
      - run: npm run typecheck
        working-directory: tests/integration
      # Runs the suite; every RPC needs a passing [rpc:X] test and must show up
      # in OpenFGA's own per-method metrics during the run.
      - run: python3 scripts/check-api-coverage.py
      # The bundled API against this OpenFGA, on its own throwaway stores.
      - name: API integration tests
        working-directory: api
        run: |
          npm ci
          npm run test:integration
      - if: failure()
        run: docker compose -f tests/integration/docker-compose.yaml logs openfga | tail -100

  openfga-image:
    name: OpenFGA rootfs builds and runs the official binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The unikernel rootfs copies the binary out of the pinned official image.
      - run: docker build --platform linux/amd64 --tag demo-fga-openfga-rootfs infrastructure/unikraft/openfga
      - name: Check the binary's version
        run: |
          . ./versions.env
          docker run --rm --entrypoint /usr/bin/openfga demo-fga-openfga-rootfs version 2>&1 | tee /dev/stderr | grep -F "\`$OPENFGA_VERSION\`"

  api-image:
    name: API rootfs builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same Dockerfile the Kraftfile uses for the unikernel rootfs.
      - run: docker build --platform linux/amd64 --tag demo-fga-api-rootfs api
      # Start the rootfs's Node on the bundle, as the unikernel does, with no
      # OpenFGA behind it: the API must still start and answer /health.
      - name: Smoke-test the image
        run: |
          docker run -d --name api -p 127.0.0.1:8080:8080 -e FGA_KEY=smoke -e FGA_API_URL=http://127.0.0.1:1 \
            demo-fga-api-rootfs /usr/bin/node /usr/src/server.mjs
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 1; done
          docker logs api
          exit 1
