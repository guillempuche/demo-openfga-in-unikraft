# Who may connect, and how, when TLS is on (wrapper.sh passes this file as
# hba_file; without TLS, PostgreSQL uses the pg_hba.conf in its data directory).
# The local Compose stacks mount the same file.
# TYPE     DATABASE  USER  ADDRESS  METHOD
# Inside the instance, over the Unix socket: wrapper.sh's first-boot setup.
local      all       all            trust
# Over the network: TLS, then the password (SCRAM, which never sends it).
hostssl    all       all   all      scram-sha-256
# Unencrypted network connections get a clear "no encryption" error.
hostnossl  all       all   all      reject
